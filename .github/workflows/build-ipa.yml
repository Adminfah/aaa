name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          pwd
          ls -lah

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "HTV811D.zip" ]; then
            echo "ERROR: HTV811D.zip not found"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q HTV811D.zip -d extracted

          # Remove macOS metadata folders
          find extracted -type d -name "__MACOSX" -prune -exec rm -rf {} + || true

          # Remove AppleDouble metadata files
          find extracted -type f -name "._*" -delete || true

          echo "Extracted project:"
          find extracted -maxdepth 5 -print

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Find valid Xcode project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_PATH=""

          while IFS= read -r candidate; do
            if [ -f "$candidate/project.pbxproj" ]; then
              PROJECT_PATH="$candidate"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE/extracted" \
              -type d \
              -name '*.xcodeproj' \
              ! -path '*/__MACOSX/*'
          )

          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: No valid .xcodeproj containing project.pbxproj was found."
            echo ""
            echo "All .xcodeproj directories:"
            find "$GITHUB_WORKSPACE/extracted" \
              -type d \
              -name '*.xcodeproj' \
              ! -path '*/__MACOSX/*' \
              -print || true

            echo ""
            echo "Searching for project.pbxproj:"
            find "$GITHUB_WORKSPACE/extracted" \
              -name 'project.pbxproj' \
              -print || true

            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_PATH")"

          echo "Valid Xcode project found:"
          echo "$PROJECT_PATH"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show available schemes
        shell: bash
        run: |
          set -euo pipefail

          echo "Project:"
          echo "${{ steps.project.outputs.project_path }}"

          xcodebuild \
            -project "${{ steps.project.outputs.project_path }}" \
            -list

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_PATH="${{ steps.project.outputs.project_path }}"
          BUILD_DIR="$GITHUB_WORKSPACE/build"

          rm -rf "$BUILD_DIR"

          xcodebuild clean build \
            -project "$PROJECT_PATH" \
            -scheme HTVANTIX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Find built app
        id: app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$GITHUB_WORKSPACE/build/Build/Products" \
            -type d \
            -name '*.app' \
            -print \
            -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was produced."

            echo ""
            echo "Build products:"
            find "$GITHUB_WORKSPACE/build/Build/Products" \
              -maxdepth 5 \
              -print || true

            exit 1
          fi

          echo "App found:"
          echo "$APP_PATH"

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.app.outputs.app_path }}"

          rm -rf "$GITHUB_WORKSPACE/Payload"
          rm -rf "$GITHUB_WORKSPACE/ipa"

          mkdir -p "$GITHUB_WORKSPACE/Payload"
          mkdir -p "$GITHUB_WORKSPACE/ipa"

          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/Payload/"

          cd "$GITHUB_WORKSPACE"

          /usr/bin/zip \
            -qry \
            ipa/HTVANTIX-unsigned.ipa \
            Payload

          echo "IPA created:"
          ls -lh ipa/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-unsigned-ipa
          path: ipa/HTVANTIX-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ZIP_FILE: HTV811D.zip
  PROJECT_NAME: HTVANTIX.xcodeproj
  SCHEME: HTVANTIX
  CONFIGURATION: Release
  BUNDLE_ID: com.apple.mobile.MobileHouseArrest
  EXPORT_METHOD: ad-hoc
  CODE_SIGN_IDENTITY: Apple Distribution

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          if [ -f "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE" -d extracted -x "__MACOSX/*" "*/__MACOSX/*" "*.DS_Store" "*/._*"
            SEARCH_ROOT="$GITHUB_WORKSPACE/extracted"
          else
            SEARCH_ROOT="$GITHUB_WORKSPACE"
          fi

          PROJECT_PATH="$(find "$SEARCH_ROOT" \
            -path '*/__MACOSX/*' -prune -o \
            -name "$PROJECT_NAME" -type d -print | while read -r p; do
              if [ -f "$p/project.pbxproj" ]; then
                echo "$p"
                break
              fi
            done)"

          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: valid Xcode project not found"
            find "$SEARCH_ROOT" -name "*.xcodeproj" -print || true
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_PATH")"

          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_PATH"

      - name: Configure bundle id and app token
        env:
          HTVANTIX_APP_TOKEN: ${{ secrets.HTVANTIX_APP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$HTVANTIX_APP_TOKEN" ]; then
            echo "ERROR: GitHub secret HTVANTIX_APP_TOKEN is empty or missing"
            exit 1
          fi

          INFO_PLIST="$PROJECT_DIR/HTVANTIX/Info.plist"

          if [ ! -f "$INFO_PLIST" ]; then
            echo "ERROR: Info.plist not found at $INFO_PLIST"
            find "$PROJECT_DIR" -name "Info.plist" -print || true
            exit 1
          fi

          plutil -replace CFBundleIdentifier -string "$BUNDLE_ID" "$INFO_PLIST"
          plutil -replace HTVANTIXAppToken -string "$HTVANTIX_APP_TOKEN" "$INFO_PLIST"

          echo "Bundle ID:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST"
          echo "HTVANTIX_APP_TOKEN loaded"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Show available schemes
        shell: bash
        run: xcodebuild -project "$PROJECT_PATH" -list

      - name: Archive signed app
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HTVANTIX.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Export signed IPA
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${DEVELOPMENT_TEAM}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>${CODE_SIGN_IDENTITY}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          rm -rf "$GITHUB_WORKSPACE/ipa"
          mkdir -p "$GITHUB_WORKSPACE/ipa"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HTVANTIX.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$GITHUB_WORKSPACE/ipa"

          ls -lh "$GITHUB_WORKSPACE/ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-signed-ipa
          path: ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

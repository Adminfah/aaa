name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show files
        run: |
          pwd
          ls -lah

      - name: Extract project ZIP
        run: |
          set -euo pipefail

          if [ ! -f "HTV811D.zip" ]; then
            echo "ERROR: HTV811D.zip not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q HTV811D.zip -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -print

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_PATH="$(find "$GITHUB_WORKSPACE/extracted" \
            -name '*.xcodeproj' \
            -type d \
            -print \
            -quit)"

          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: No .xcodeproj found inside HTV811D.zip"
            echo ""
            echo "Extracted contents:"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 6 -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_PATH")"
          PROJECT_NAME="$(basename "$PROJECT_PATH")"

          echo "Found project:"
          echo "$PROJECT_PATH"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show available schemes
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "${{ steps.project.outputs.project_path }}" \
            -list

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_PATH="${{ steps.project.outputs.project_path }}"
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          BUILD_DIR="$GITHUB_WORKSPACE/build"

          echo "Building:"
          echo "$PROJECT_PATH"

          xcodebuild clean build \
            -project "$PROJECT_PATH" \
            -scheme HTVANTIX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Find built app
        id: app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$GITHUB_WORKSPACE/build/Build/Products" \
            -name '*.app' \
            -type d \
            -print \
            -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app produced"
            find "$GITHUB_WORKSPACE/build" -maxdepth 8 -print || true
            exit 1
          fi

          echo "Found app:"
          echo "$APP_PATH"

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.app.outputs.app_path }}"

          rm -rf "$GITHUB_WORKSPACE/Payload"
          rm -rf "$GITHUB_WORKSPACE/ipa"

          mkdir -p "$GITHUB_WORKSPACE/Payload"
          mkdir -p "$GITHUB_WORKSPACE/ipa"

          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/Payload/"

          cd "$GITHUB_WORKSPACE"

          /usr/bin/zip \
            -qry \
            ipa/HTVANTIX-unsigned.ipa \
            Payload

          echo "IPA created successfully:"
          ls -lh ipa/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-unsigned-ipa
          path: ipa/HTVANTIX-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
